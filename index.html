
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0891b2;
        }

        p {
            line-height: 1.7;
        }

        button {
            background: #0891b2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0e7490;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hello, World! 👋</h1>

        <p>
            Welcome to my first website!
            I'm testing my website using GitHub Pages.
        </p>

        <button onclick="showMessage()">
            Click Me!
        </button>

        <p id="message"></p>

        <footer>
            Built with HTML, CSS and JavaScript
        </footer>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Success! Your website is working perfectly! 🎉";
        }
    </script>
</body>
</html>
